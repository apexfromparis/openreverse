name: Windows CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Configure
        run: cmake --preset windows-x64

      - name: Build Release
        run: cmake --build --preset windows-x64-release --parallel

      - name: Run core tests
        run: ctest --preset windows-x64-release

      - name: Build Debug
        run: cmake --build --preset windows-x64-debug --parallel

      - name: Run Debug tests
        run: ctest --preset windows-x64-debug

      - name: Run CLI smoke tests
        shell: pwsh
        run: |
          $app = 'build/windows-x64/bin/Release/OpenReverse.exe'
          $fixture = 'build/windows-x64/bin/Release/OpenReverseTestFixture.exe'

          $help = Start-Process $app -ArgumentList '--help' -NoNewWindow -Wait -PassThru
          if ($help.ExitCode -ne 0) { throw "--help failed with exit code $($help.ExitCode)" }

          $versionOutput = Join-Path $env:RUNNER_TEMP 'openreverse-version.txt'
          $version = Start-Process $app -ArgumentList '--version' -NoNewWindow -Wait -PassThru -RedirectStandardOutput $versionOutput
          if ($version.ExitCode -ne 0) { throw "--version failed with exit code $($version.ExitCode)" }
          $expectedVersion = (Get-Content VERSION -Raw).Trim()
          if ((Get-Content $versionOutput -Raw).Trim() -ne "$expectedVersion (openreverse)") {
            throw '--version returned unexpected output'
          }

          $open = Start-Process $app -ArgumentList @('open', $fixture) -NoNewWindow -Wait -PassThru
          if ($open.ExitCode -ne 0) { throw "static PE open failed with exit code $($open.ExitCode)" }

          $missing = Start-Process $app -ArgumentList @('open', 'missing-file.exe') -NoNewWindow -Wait -PassThru
          if ($missing.ExitCode -eq 0) { throw 'missing-file open unexpectedly succeeded' }

      - name: Verify installer
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          $installer = "build/windows-x64/bin/Release/OpenReverse-$version-Setup.exe"
          if (!(Test-Path $installer)) { throw "Installer was not built: $installer" }
