name: Bug report
description: Report a reproducible problem in OpenReverse
title: "[Bug]: "
labels:
  - bug
body:
  - type: input
    id: version
    attributes:
      label: OpenReverse version
      description: Use Help > About, `OpenReverse.exe --version`, or a commit hash.
      placeholder: 2.0.0-beta.1 or commit SHA
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11 24H2, build 26100
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Explain what went wrong and which target type was involved.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open...
        2. Select...
        3. Observe...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Logs or screenshots
      description: Remove credentials, private binaries, memory contents, and personal data.
